openapi: 3.0.3
info:
  title: enman API
  version: 0.1.0
servers:
  - description: Development server
    url: http://localhost:1099
  - description: Production server
    url: https://your-domain.example.com
tags:
  - name: health
    description: Health check endpoint
  - name: auth
    description: 認証エンドポイント
  - name: families
    description: 家族グループ管理
  - name: users
    description: ユーザー管理
paths:
  /health:
    $ref: "./paths/health.yaml"
  /auth/register:
    post:
      summary: ユーザー登録
      operationId: postAuthRegister
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "./components/schemas/response/default.yaml"
  /auth/login:
    post:
      summary: ログイン
      operationId: postAuthLogin
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "./components/schemas/response/default.yaml"
  /auth/refresh:
    post:
      summary: アクセストークン更新
      operationId: postAuthRefresh
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: トークン更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          $ref: "./components/schemas/response/default.yaml"
  /auth/logout:
    delete:
      summary: ログアウト
      operationId: deleteAuthLogout
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: ログアウト成功
        default:
          $ref: "./components/schemas/response/default.yaml"
  /families:
    post:
      summary: 家族グループ作成
      operationId: postFamilies
      tags:
        - families
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: 家族グループ作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyResponse"
        default:
          $ref: "./components/schemas/response/default.yaml"
  /families/join:
    post:
      summary: 招待コードで家族グループに参加
      operationId: postFamiliesJoin
      tags:
        - families
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyRequest"
      responses:
        "200":
          description: 参加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyResponse"
        default:
          $ref: "./components/schemas/response/default.yaml"
  /users/me:
    get:
      summary: 自分のプロフィール取得
      operationId: getUsersMe
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: プロフィール取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "./components/schemas/response/default.yaml"
    patch:
      summary: プロフィール更新
      operationId: patchUsersMe
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "./components/schemas/response/default.yaml"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          example: "田中太郎"
        email:
          type: string
          format: email
          example: "taro@example.com"
        password:
          type: string
          minLength: 8
          example: "password123"
        role:
          type: string
          example: "パパ"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    CreateFamilyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "田中家"
    JoinFamilyRequest:
      type: object
      required:
        - invite_code
      properties:
        invite_code:
          type: string
          example: "ABC123DEF456"
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          example: "田中太郎"
        role:
          type: string
          example: "パパ"
        icon_url:
          type: string
          example: "https://example.com/icon.png"
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        access_token:
          type: string
        refresh_token:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        family_id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        role:
          type: string
        icon_url:
          type: string
          nullable: true
        email:
          type: string
        enman_point:
          type: integer
        created_at:
          type: string
          format: date-time
    FamilyResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        invite_code:
          type: string
        created_at:
          type: string
          format: date-time
