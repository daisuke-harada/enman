openapi: 3.0.3
info:
  title: enman API
  version: 0.1.0
servers:
- description: Development server
  url: http://localhost:1099
- description: Production server
  url: https://your-domain.example.com
tags:
- description: Health check endpoint
  name: health
- description: 認証エンドポイント
  name: auth
- description: 家族グループ管理
  name: families
- description: ユーザー管理
  name: users
- description: 家事（タスク）管理
  name: tasks
- description: 家事テンプレート
  name: task-templates
- description: 感謝スタンプ管理
  name: appreciations
- description: 通知センター
  name: notifications
- description: 貢献度統計
  name: stats
- description: ご褒美目標
  name: goals
- description: 繰り返しルール管理
  name: recurrence-rules
- description: カレンダー表示
  name: calendar
paths:
  /health:
    get:
      description: Returns 200 OK if the service is running.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_200_response"
          description: Service is healthy
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      summary: Health check
      tags:
      - health
  /auth/register:
    post:
      operationId: postAuthRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: 登録成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      summary: ユーザー登録
      tags:
      - auth
  /auth/login:
    post:
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: ログイン成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      summary: ログイン
      tags:
      - auth
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: トークン更新成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      summary: アクセストークン更新
      tags:
      - auth
  /auth/logout:
    delete:
      operationId: deleteAuthLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: ログアウト成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: ログアウト
      tags:
      - auth
  /families:
    post:
      operationId: postFamilies
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyResponse"
          description: 家族グループ作成成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 家族グループ作成
      tags:
      - families
  /families/join:
    post:
      operationId: postFamiliesJoin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyResponse"
          description: 参加成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 招待コードで家族グループに参加
      tags:
      - families
  /tasks:
    get:
      operationId: getTasks
      parameters:
      - description: "pending: これからやること / today_done: 今日終わったこと"
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - today_done
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/TaskResponse"
                type: array
          description: タスク一覧取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: タスク一覧取得
      tags:
      - tasks
    post:
      operationId: postTasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: タスク作成成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: タスク作成
      tags:
      - tasks
  /tasks/{taskId}:
    delete:
      operationId: deleteTask
      parameters:
      - explode: false
        in: path
        name: taskId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: タスク削除成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: タスク削除
      tags:
      - tasks
    patch:
      operationId: patchTask
      parameters:
      - explode: false
        in: path
        name: taskId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: タスク編集成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: タスク編集
      tags:
      - tasks
  /tasks/{taskId}/done:
    patch:
      operationId: patchTasksDone
      parameters:
      - explode: false
        in: path
        name: taskId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: 完了報告成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: タスク完了報告
      tags:
      - tasks
  /tasks/{taskId}/cancel:
    patch:
      operationId: patchTasksCancel
      parameters:
      - explode: false
        in: path
        name: taskId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: キャンセル成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: タスクをキャンセル（繰り返しタスクの1件スキップ）
      tags:
      - tasks
  /task-templates:
    get:
      operationId: getTaskTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/TaskTemplateResponse"
                type: array
          description: テンプレート一覧取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 家事テンプレート一覧取得
      tags:
      - task-templates
  /tasks/{taskId}/appreciations:
    post:
      operationId: postTasksAppreciation
      parameters:
      - explode: false
        in: path
        name: taskId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAppreciationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppreciationResponse"
          description: スタンプ送信成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: ありがとうスタンプ送信
      tags:
      - appreciations
  /notifications:
    get:
      operationId: getNotifications
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AppreciationResponse"
                type: array
          description: 通知一覧取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 通知一覧取得（自分宛の感謝）
      tags:
      - notifications
  /stats/contributions:
    get:
      operationId: getStatsContributions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ContributionItem"
                type: array
          description: 貢献度統計取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 家族の貢献度統計取得
      tags:
      - stats
  /family/timeline:
    get:
      operationId: getFamilyTimeline
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AppreciationResponse"
                type: array
          description: タイムライン取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 感謝タイムライン取得（家族全体）
      tags:
      - appreciations
  /families/goals:
    get:
      operationId: getFamiliesGoals
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/FamilyGoalResponse"
                type: array
          description: 目標一覧取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: ご褒美目標一覧取得
      tags:
      - goals
    post:
      operationId: postFamiliesGoals
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyGoalRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyGoalResponse"
          description: 目標作成成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: ご褒美目標作成
      tags:
      - goals
  /recurrence-rules:
    get:
      operationId: getRecurrenceRules
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RecurrenceRuleResponse"
                type: array
          description: 一覧取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 繰り返しルール一覧取得
      tags:
      - recurrence-rules
    post:
      operationId: postRecurrenceRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrenceRuleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrenceRuleResponse"
          description: 作成成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 繰り返しルール作成
      tags:
      - recurrence-rules
  /recurrence-rules/{ruleId}:
    delete:
      operationId: deleteRecurrenceRule
      parameters:
      - explode: false
        in: path
        name: ruleId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: 削除成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 繰り返しルール削除（以降のインスタンスをすべて終了）
      tags:
      - recurrence-rules
    patch:
      operationId: patchRecurrenceRules
      parameters:
      - explode: false
        in: path
        name: ruleId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrenceRuleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrenceRuleResponse"
          description: 更新成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 繰り返しルール更新
      tags:
      - recurrence-rules
  /calendar:
    get:
      operationId: getCalendar
      parameters:
      - explode: true
        in: query
        name: year
        required: true
        schema:
          example: 2026
          type: integer
        style: form
      - explode: true
        in: query
        name: month
        required: true
        schema:
          example: 5
          maximum: 12
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CalendarDayItem"
                type: array
          description: カレンダー取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 月別カレンダー取得（繰り返しタスク展開済み）
      tags:
      - calendar
  /users/me:
    get:
      operationId: getUsersMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: プロフィール取得成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: 自分のプロフィール取得
      tags:
      - users
    patch:
      operationId: patchUsersMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: 更新成功
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_default_response"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: プロフィール更新
      tags:
      - users
components:
  responses:
    default:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/getHealth_default_response"
      description: Unexpected error
  schemas:
    RegisterRequest:
      example:
        name: 田中太郎
        email: taro@example.com
        password: password123
        role: パパ
      properties:
        name:
          example: 田中太郎
          type: string
        email:
          example: taro@example.com
          format: email
          type: string
        password:
          example: password123
          minLength: 8
          type: string
        role:
          example: パパ
          type: string
      required:
      - email
      - name
      - password
      - role
      type: object
    LoginRequest:
      example:
        email: email
        password: password
      properties:
        email:
          format: email
          type: string
        password:
          type: string
      required:
      - email
      - password
      type: object
    RefreshRequest:
      example:
        refresh_token: refresh_token
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      type: object
    LogoutRequest:
      example:
        refresh_token: refresh_token
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      type: object
    CreateFamilyRequest:
      example:
        name: 田中家
      properties:
        name:
          example: 田中家
          type: string
      required:
      - name
      type: object
    JoinFamilyRequest:
      example:
        invite_code: ABC123DEF456
      properties:
        invite_code:
          example: ABC123DEF456
          type: string
      required:
      - invite_code
      type: object
    UpdateProfileRequest:
      example:
        name: 田中太郎
        role: パパ
        icon_url: https://example.com/icon.png
      properties:
        name:
          example: 田中太郎
          type: string
        role:
          example: パパ
          type: string
        icon_url:
          example: https://example.com/icon.png
          type: string
      type: object
    AuthResponse:
      example:
        user:
          id: 0
          family_id: 6
          name: name
          role: role
          icon_url: icon_url
          email: email
          enman_point: 1
          invite_code: invite_code
          created_at: 2000-01-23T04:56:07.000+00:00
        access_token: access_token
        refresh_token: refresh_token
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        access_token:
          type: string
        refresh_token:
          type: string
      type: object
    TokenResponse:
      example:
        access_token: access_token
        refresh_token: refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      type: object
    UserResponse:
      example:
        id: 0
        family_id: 6
        name: name
        role: role
        icon_url: icon_url
        email: email
        enman_point: 1
        invite_code: invite_code
        created_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: int64
          type: integer
        family_id:
          format: int64
          nullable: true
          type: integer
        name:
          type: string
        role:
          type: string
        icon_url:
          nullable: true
          type: string
        email:
          type: string
        enman_point:
          type: integer
        invite_code:
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
      type: object
    UpdateTaskRequest:
      example:
        title: 皿洗い
        category: キッチン
      properties:
        title:
          example: 皿洗い
          type: string
        category:
          example: キッチン
          nullable: true
          type: string
      required:
      - title
      type: object
    CreateTaskRequest:
      example:
        title: 皿洗い
        category: キッチン
        recurrence_rule_id: 0
        scheduled_date: 2000-01-23
      properties:
        title:
          example: 皿洗い
          type: string
        category:
          example: キッチン
          type: string
        recurrence_rule_id:
          description: 繰り返しルールから生成されたインスタンスの場合に設定
          format: int64
          nullable: true
          type: integer
        scheduled_date:
          description: 予定日（繰り返しタスクのインスタンス化日）
          format: date
          nullable: true
          type: string
      required:
      - title
      type: object
    TaskResponse:
      example:
        id: 0
        family_id: 6
        created_by: 1
        done_by: 5
        title: title
        category: category
        status: pending
        done_at: 2000-01-23T04:56:07.000+00:00
        recurrence_rule_id: 5
        scheduled_date: 2000-01-23
        created_at: 2000-01-23T04:56:07.000+00:00
        comments:
        - id: 2
          task_id: 7
          task_title: task_title
          from_user_id: 9
          from_user_name: from_user_name
          to_user_id: 3
          to_user_name: to_user_name
          message: message
          created_at: 2000-01-23T04:56:07.000+00:00
        - id: 2
          task_id: 7
          task_title: task_title
          from_user_id: 9
          from_user_name: from_user_name
          to_user_id: 3
          to_user_name: to_user_name
          message: message
          created_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: int64
          type: integer
        family_id:
          format: int64
          type: integer
        created_by:
          format: int64
          type: integer
        done_by:
          format: int64
          nullable: true
          type: integer
        title:
          type: string
        category:
          nullable: true
          type: string
        status:
          enum:
          - pending
          - done
          - cancelled
          type: string
        done_at:
          format: date-time
          nullable: true
          type: string
